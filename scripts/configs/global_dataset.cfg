[general]
device = cuda
dtype = float32

[model]
hidden_layers = 3
layer_width = 64
triplane_resolution = 512
triplane_features = 8
use_thickness = true

[training]
epochs = 250
batch_size = 1048576
num_workers = 0
keep_on_device = true
learning_rate = 1e-3
lr_step_size = 50
lr_step_gamma = 0.5
momentum = 0.9
dataset = # PATH TO DATASET
dataset_fraction = 1.0
validation = 0.1
